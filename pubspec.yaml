name: mundial2026
description: "Fixture y simulador del Mundial 2026 — calendario real, resultados en vivo y predicciones."
publish_to: 'none'

version: 1.0.1+11

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  intl: ^0.20.0
  supabase_flutter: ^2.8.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  open_filex: ^4.5.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# Ícono de la app: trofeo estilizado propio (no usa la marca FIFA).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/branding/app_icon_fg.png"

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/flags/
    - assets/branding/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Variable.ttf
